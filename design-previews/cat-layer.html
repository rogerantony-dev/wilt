<!doctype html>
<html><head><meta charset="utf-8"><title>layer</title>
<style>:root{--ink:#0D0D0C}html,body{margin:0;background:transparent;overflow:hidden}svg{display:block}</style>
</head><body><div id="f"></div>
<script src="rot-cat.js"></script>
<script src="cat-figure.js"></script>
<script>
// ?layer=base|head|top|body|bottom&item=<id>&stage=1..6&box=figure|pill renders one layer of the
// dressed cat for res/drawable (see scripts/render-cat-layers.sh). Screenshot with
// --default-background-color=00000000 at 360x619 (figure) or 192x192 (pill) for transparency.
const q = new URLSearchParams(location.search);
const box = q.get('box') === 'pill' ? 'pill' : 'figure';
const stage = Math.min(6, Math.max(1, parseInt(q.get('stage') || '1', 10) || 1));
const [w, h] = box === 'pill' ? [192, 192] : [360, 619];
const svg = figureLayer(q.get('layer') || 'base', STAGE_T[stage - 1], { item: q.get('item') || 'none', box, id: 'L' });
const f = document.getElementById('f');
f.innerHTML = svg;
f.firstElementChild.setAttribute('width', w);
f.firstElementChild.setAttribute('height', h);
</script></body></html>
